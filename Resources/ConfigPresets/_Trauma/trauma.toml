[game]
role_timers = true
role_timer_override = "Trauma"
round_end_pvs_overrides = true
lobbyduration = 180
fallbackpreset = "Traitor,Survival,Extended"
#minimum_job_fallback = "SameDepartment" # re-enable if it gets fixed

[chat]
max_announcement_length = 512

[voice]
barks_enabled = true
# Proximity microphone chat is opt-in. Players use the client console commands "voice" and "voice off".
# To enable it, set the following in the instance config. Forward /voice and /voice/* to
# the game's status HTTP listener, with WebSocket upgrades for /voice/ws.
# enabled = true
# public_url = "https://station.example.org/voice"
# For a single-machine test, use "http://localhost:1212/voice" with your status port.

[shuttle]
cooldown = 5

[net]
pvs_enter_budget = 300 # 200 by default
log_late_msg = false # pointless log spam why is this on in release

[afk]
time = 1500 # 25m
confirm_timeout = 90 # 1.5m

[biomass]
easy_mode = false # woodchipper is actually dangerous

[ic]
ssd_sleep = false # chuddy and doesnt account for NPCs
flavor_text = true # Born to larp
punctuation = true # extreme role play

[infolinks]
bug_report = "https://github.com/Trauma-Station/Trauma-Station/issues/created_by/choose"
discord    = "https://discord.traumastation.com"
github     = "https://github.com/Trauma-Station/Trauma-Station"
wiki       = "https://wiki.traumastation.com"
