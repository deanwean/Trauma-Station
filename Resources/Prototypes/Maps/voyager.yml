- type: gameMap
  id: Voyager
  mapName: 'Voyager'
  mapPath: /Maps/voyager.yml
  minPlayers: 0
  maxPlayers: 36
  stations:
    Voyager:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Voyager {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: ' DN'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs:
            # Command
            Captain: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 2 ]
            # Service
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            # Engineering
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 2, 2 ]
            TechnicalAssistant: [ 1, 1 ]
            # Medical
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 2, 2 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 1, 1 ]
            # Science
            Scientist: [ 2, 2 ]
            ResearchAssistant: [ 1, 1 ]
            # Security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 2, 2 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 1, 1 ]
            # Supply
            SalvageSpecialist: [ 2, 2 ]
            CargoTechnician: [ 2, 2 ]
            # Civilian
            Passenger: [ -1, -1 ]
            Janitor: [ 1, 1 ]
            Lawyer: [ 1, 1 ]
            Chaplain: [ 1, 1 ]